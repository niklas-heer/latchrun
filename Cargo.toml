[package]
name = "latchrun"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
description = "Local command sessions with scoped credential access"
license = "MIT"
repository = "https://github.com/niklas-heer/latchrun"
publish = false

[dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user", "fs", "resource", "term"] }
portable-pty = "0.9"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
terminal_size = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"

[[bench]]
name = "latency"
harness = false

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
