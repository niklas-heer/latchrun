# Release dependency inventory; normal and build dependencies are included.
# Prefer one permissive alternative where crates offer a choice.
accepted = ["MIT", "BSD-2-Clause", "Unicode-3.0"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
