name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          manifest_version=$(awk '/^\[package\]/{package=1;next} /^\[/{package=0} package && /^version = /{gsub(/"/, "", $3);print $3;exit}' Cargo.toml)
          test "$version" = "$manifest_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check and package Linux with Dagger
        if: runner.os == 'Linux'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.9"
          call: release --version ${{ steps.release.outputs.version }} --target ${{ matrix.target }} --epoch ${{ steps.release.outputs.epoch }} export --path dist
      - name: Smoke-test Linux archive on Ubuntu 24.04
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          extracted=$(mktemp -d "$RUNNER_TEMP/latchrun-smoke.XXXXXX")
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf "dist/latchrun-v${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz" -C "$extracted"
          ldd --version
          sh scripts/smoke-release.sh "$extracted/latchrun"
      - name: Install native macOS toolchain
        if: runner.os == 'macOS'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
      - name: Check and package macOS
        if: runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.epoch }}
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          LATCHRUN_REQUIRE_SHELLS: "1"
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-release.sh check "$RELEASE_VERSION" "$RELEASE_TARGET"
          brew install fish
          mise run check
          cargo build --locked --release --target "$RELEASE_TARGET"
          sh scripts/package-release.sh package "$RELEASE_VERSION" "$RELEASE_TARGET" "$SOURCE_DATE_EPOCH" "target/$RELEASE_TARGET/release/latchrun" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  assemble:
    name: Verify complete release artifact set
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Verify every archive and assemble checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            archive="latchrun-${RELEASE_TAG}-${target}.tar.gz"
            test -f "$archive"
            sha256sum --check "$archive.sha256"
            tar -tzf "$archive" | grep -Fx './latchrun'
            tar -tzf "$archive" | grep -Fx './LICENSE'
            tar -tzf "$archive" | grep -Fx './README.md'
            tar -tzf "$archive" | grep -Fx './THIRD_PARTY_LICENSES.txt'
          done
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          sha256sum --check SHA256SUMS
          rm ./*.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Record publication handoff
        run: echo 'All four archives are verified in release-assets. Publication is a separate maintainer action; this workflow does not create or publish a GitHub release.' >> "$GITHUB_STEP_SUMMARY"
