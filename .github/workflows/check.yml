name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dagger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.9"
          call: ci

  macos:
    name: macos (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    timeout-minutes: 20
    env:
      LATCHRUN_REQUIRE_SHELLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
      - name: Install Fish for the required shell matrix
        run: brew install fish
      - name: Record shell versions
        run: |
          /bin/bash --version
          /bin/zsh --version
          fish --version
      - run: mise run check
      - run: mise run build
      - run: ./target/release/latchrun --help
