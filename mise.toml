[tools]
dagger = "0.21.9"
git-cliff = "2.14.2"
# Keep aligned with rust-toolchain.toml and Cargo.toml.
rust = { version = "1.97.1", profile = "minimal", components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"] }

[tasks.fmt]
description = "Format Rust source"
run = "cargo fmt --all"

[tasks.check]
description = "Check formatting, compilation, lints, and tests"
run = [
  "cargo fmt --all -- --check",
  "cargo check --locked --all-targets --all-features",
  "cargo clippy --locked --all-targets --all-features -- -D warnings",
  "cargo test --locked --all-features",
]

[tasks.test]
description = "Run Rust tests"
run = "cargo test --locked --all-features"

[tasks.build]
description = "Build the release binary"
run = "cargo build --locked --release"

[tasks.ci]
description = "Run Linux checks in Dagger (requires a running container engine)"
run = "dagger call ci"

[tasks.bench]
description = "Measure release CLI latency with isolated fake providers"
run = "cargo bench --locked --bench latency"

[tasks.changelog]
description = "Generate CHANGELOG.md from Conventional Commits (pass --tag vX.Y.Z before tagging)"
run = "git-cliff --config cliff.toml --output CHANGELOG.md"

[tasks.release-notes]
description = "Print generated notes for the release tag at HEAD"
run = "git-cliff --config cliff.toml --current --strip header"
