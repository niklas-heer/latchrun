# Release notes come from Conventional Commits; no network or provider access.
[changelog]
header = """
# Changelog

Generated from [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).
See [the release policy](docs/releasing.md) for versioning and compatibility.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/niklas-heer/latchrun/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/niklas-heer/latchrun/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
require_conventional = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = '^chore\(release\):', skip = true },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Fixes" },
  { message = '^perf', group = "Performance" },
  { message = '^docs', group = "Documentation" },
  { message = '^test', group = "Verification" },
  { message = '^(ci|build)', group = "Build and delivery" },
  { message = '.*', group = "Maintenance" },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"

[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
